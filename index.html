<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0A09" />
    <meta
      name="description"
      content="THE W — a 2026-season showcase of the players defining the WNBA. A portfolio interactive experience."
    />
    <title>THE W — 2026 Player Showcase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=Martian+Mono:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the anchor player's portrait from static HTML so it downloads
         in parallel with the JS bundle (not after it), keeping the first photo
         fast even on a cold first visit. Served from /public at a stable URL so
         the <img> src matches this href exactly and the browser reuses it. -->
    <link
      rel="preload"
      as="image"
      href="/players/aja-wilson.jpeg"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
